
settings:
  debug: false
  prefix: "<gradient:#E879F9:#A855F7>WalsonChatManager</gradient>"

  update-checker: true

database:
  type: SQLITE
  file: "mutes.db"

chat:
  mute-announcements:
    enabled: true

  global-mute:
    enabled: false
    staff-bypass: true
    announce: true

  filtering:
    enabled: true

  cooldown:
    enabled: false
    seconds: 3

anti-spam:
  enabled: true

  # Rolling window used to count consecutive chat messages.
  window-seconds: 1

  # "More than" semantics: 5 warns and blocks on message 6.
  warning-threshold: 5

  # Chat is blocked for this many seconds after a spam warning.
  # Set to 0 to disable the cooldown.
  cooldown-seconds: 2

  # Number of separate spam warnings allowed before an automatic mute.
  warnings-before-mute: 4

  # Rolling period in which warnings are counted. Warnings older than this
  # period are removed from the player's warning total.
  warning-reset-hours: 24

  mute-duration: "10m"
  mute-reason: "Spamming"

gui:
  title: "<dark_gray>WalsonChatManager"
  rows: 6

  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "

integrations:
  discordsrv:
    enabled: true
    announce-mutes: true
    announce-unmutes: true
    announce-global-chat: true
    staff-logs: true

# Notification sounds. Sound names must match Bukkit's Sound enum.
sounds:
  mute:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BELL
    volume: 1.0
    pitch: 1.0

  unmute:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0

  chat-filter-warning:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.0

  global-chat-muted:
    enabled: true
    sound: BLOCK_ANVIL_LAND
    volume: 1.0
    pitch: 0.8

  global-chat-unmuted:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
