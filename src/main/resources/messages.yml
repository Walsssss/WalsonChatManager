
prefix: "<gradient:#E879F9:#A855F7>WCM</gradient> <dark_gray>»"

general:
  no-permission: "<red>You don't have permission to do this."
  player-not-found: "<red>Player not found."
  players-only: "<red>This command can only be used by players."
  reload-success: "<green>Configuration successfully reloaded."
  invalid-usage: "<red>Invalid command usage."

mute:
  success: "<green>You have muted <white>%player%</white>. <gray>Reason: <white>%reason%</white>. <gray>Time: <white>%duration%</white>."
  received: "<red>You have been muted <white>%player-duration%</white>. <gray>Reason: <white>%reason%</white>."
  chat-blocked: "<red>You have been muted <white>%duration%</white>. <gray>Reason: <white>%reason%</white>."
  already-muted: "<red>This player is already muted."
  not-muted: "<red>This player is not muted."
  expired: "<green>Your mute has expired."
  permanent: "Permanent"

unmute:
  success: "<green>You have unmuted <white>%player%</white>."
  received: "<green>Your mute has been removed."
  not-muted: "<red>This player is not muted."

global-chat:
  muted: "<red>Global chat has been disabled by <white>%staff%</white>."
  unmuted: "<green>Global chat has been enabled by <white>%staff%</white>."
  blocked: "<red>Global chat is currently disabled."
  already-muted: "<yellow>Global chat is already disabled."
  already-unmuted: "<yellow>Global chat is already enabled."

filter:
  blocked: "<red>Your message was blocked by the chat filter."
  warned: "<red>Please watch your language."
  warned-category: "<red>Please watch your language. <gray>Category: <white>%category%</white>."
  muted: "<red>You were muted for violating the chat rules."

database:
  error: "<red>A database error occurred. Please contact an administrator."

mute-history:
  no-history: "<red>No mute history found for <white>%player%</white>."
